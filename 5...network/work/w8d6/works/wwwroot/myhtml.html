<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备监控</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f5f5f5; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; }
        h1 { text-align: center; }
        .sensor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .sensor-item { background: #e8f0fe; padding: 15px; border-radius: 8px; text-align: center; }
        .sensor-label { font-size: 14px; color: #555; }
        .sensor-value { font-size: 24px; font-weight: bold; color: #1a73e8; }
        .control-row { display: flex; justify-content: center; gap: 30px; }
        button { padding: 8px 20px; margin: 3px; font-size: 14px; cursor: pointer; border: none; border-radius: 4px; }
        .btn-on { background: #4CAF50; color: white; }
        .btn-off { background: #f44336; color: white; }
        .status { font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>设备监控面板</h1>
        
        <h2>传感器数据</h2>
        <div class="sensor-grid">
            <div class="sensor-item">
                <div class="sensor-label">光线传感器</div>
                <div class="sensor-value" id="light">--</div>
            </div>
            <div class="sensor-item">
                <div class="sensor-label">加速度 X</div>
                <div class="sensor-value" id="accelX">--</div>
            </div>
            <div class="sensor-item">
                <div class="sensor-label">加速度 Y</div>
                <div class="sensor-value" id="accelY">--</div>
            </div>
            <div class="sensor-item">
                <div class="sensor-label">加速度 Z</div>
                <div class="sensor-value" id="accelZ">--</div>
            </div>
        </div>

        <h2>设备控制</h2>
        <div class="control-row">
            <div style="text-align:center">
                <div>LED 灯</div>
                <button class="btn-on" onclick="control(0, 1)">开</button>
                <button class="btn-off" onclick="control(0, 0)">关</button>
                <div class="status" id="ledStatus">未知</div>
            </div>
            <div style="text-align:center">
                <div>蜂鸣器</div>
                <button class="btn-on" onclick="control(1, 1)">开</button>
                <button class="btn-off" onclick="control(1, 0)">关</button>
                <div class="status" id="buzzerStatus">未知</div>
            </div>
        </div>
    </div>

    <script>
        // 封装通用 POST 函数，使用相对路径 "/"
        function postRequest(body, callback) {
            var xhr = new XMLHttpRequest();
            xhr.open("POST", "/", true);
            xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
            xhr.onload = function() {
                if (callback) callback(this.responseText);
            };
            xhr.send(body);
        }

        // 1. 获取传感器数据（POST 请求体：type=sensors）
        function fetchSensors() {
            postRequest("type=sensors", function(response) {
                var parts = response.split(",");
                if (parts.length === 4) {
                    document.getElementById("light").textContent = parts[0];
                    document.getElementById("accelX").textContent = parts[1];
                    document.getElementById("accelY").textContent = parts[2];
                    document.getElementById("accelZ").textContent = parts[3];
                }
            });
        }

        // 2. 获取线圈状态（POST 请求体：type=coils）
        function fetchCoils() {
            postRequest("type=coils", function(response) {
                var parts = response.split(",");
                if (parts.length === 2) {
                    updateLed(parseInt(parts[0]));
                    updateBuzzer(parseInt(parts[1]));
                }
            });
        }

        // 3. 控制线圈（POST 请求体：type=coil&coil=0&value=1）
        function control(coil, value) {
            var body = "type=coil&coil=" + coil + "&value=" + value;
            postRequest(body, function(response) {
                // 后端直接返回线圈状态，格式："led,buz" 例如 "1,0"
                var parts = response.split(",");
                if (parts.length === 2) {
                    updateLed(parseInt(parts[0]));
                    updateBuzzer(parseInt(parts[1]));
                }
            });
        }

        function updateLed(state) {
            var el = document.getElementById("ledStatus");
            if (state === 1) {
                el.textContent = "开";
                el.style.color = "green";
            } else {
                el.textContent = "关";
                el.style.color = "red";
            }
        }

        function updateBuzzer(state) {
            var el = document.getElementById("buzzerStatus");
            if (state === 1) {
                el.textContent = "开";
                el.style.color = "green";
            } else {
                el.textContent = "关";
                el.style.color = "red";
            }
        }

        // 页面加载时立即获取数据，并每秒刷新传感器
        window.onload = function() {
            fetchSensors();
            fetchCoils();
            setInterval(fetchSensors, 1000);
        };
    </script>
</body>
</html>
